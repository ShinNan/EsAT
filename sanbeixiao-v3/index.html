<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#153f35">
<title>三倍笑商品目录</title>
<script src="./config.js"></script>
<script src="https://static.cloudbase.net/cloudbase-js-sdk/latest/cloudbase.full.js"></script>
<style>
:root{--g:#153f35;--l:#c7dc78;--c:#f5f1e8;--p:#fffdf8;--i:#18332d;--m:#6d7772;--b:#ded8cb;--r:#b32929;--ok:#2f6b52}*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer}.head{background:var(--g);color:#fff;padding:24px 20px;display:flex;justify-content:space-between;align-items:center;gap:14px}.head h1{font-size:27px;margin:4px 0}.head p{margin:0;color:#c9d8d3}.head small{color:var(--l);font-weight:800}.head button{background:transparent;color:#fff;border:1px solid #ffffff55;border-radius:999px;padding:9px 14px}.status{max-width:1100px;margin:12px auto 0;padding:0 16px;font-size:12px;color:var(--m)}.status b{color:var(--ok)}.tools{padding:14px 16px 18px;max-width:1100px;margin:auto}.search{width:100%;height:46px;border:1px solid var(--b);background:#fff;border-radius:13px;padding:0 14px}.cats{display:flex;gap:8px;overflow:auto;padding-top:12px}.cats button{white-space:nowrap;border:1px solid var(--b);background:transparent;border-radius:999px;padding:7px 13px}.cats button.on{background:var(--g);color:#fff}.grid{max-width:1100px;margin:auto;padding:0 16px 105px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:var(--p);border:1px solid var(--b);border-radius:18px;overflow:hidden}.pic{height:180px;background:#e7ead8;display:grid;place-items:center;font-size:45px}.pic img{width:100%;height:100%;object-fit:cover}.info{padding:14px}.tag{font-size:11px;background:#e6edcf;padding:3px 7px;border-radius:20px}.info h2{font-size:18px;margin:9px 0 4px}.info p{font-size:13px;color:var(--m);margin:0}.productlink{display:inline-block;margin-top:9px;color:var(--g);font-size:13px;font-weight:800;text-decoration:none}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:15px;gap:8px}.price{font-size:20px;font-weight:800}.step{display:flex;align-items:center;gap:8px}.step button{border:0;background:var(--g);color:#fff;width:34px;height:34px;border-radius:50%}.cart{position:fixed;z-index:5;bottom:12px;left:50%;transform:translateX(-50%);width:min(700px,calc(100% - 24px));background:#102f28;color:#fff;border-radius:18px;padding:11px 12px 11px 18px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 10px 30px #102f2866}.cart b{display:block;font-size:21px}.cart span{font-size:12px;color:#bdcdc8}.cart button,.primary{border:0;background:var(--l);font-weight:800;border-radius:11px;padding:13px 18px}.overlay{position:fixed;inset:0;background:#102f28aa;z-index:10;display:grid;place-items:center;padding:16px}.panel{background:var(--p);width:min(650px,100%);max-height:92vh;overflow:auto;border-radius:20px;padding:22px;position:relative}.x{position:absolute;right:12px;top:8px;border:0;background:transparent;font-size:28px}.panel h2{margin-top:0}.panel h3{margin:22px 0 8px}.field{display:flex;flex-direction:column;gap:6px;margin:11px 0;font-size:13px;font-weight:700}.field input{height:43px;border:1px solid var(--b);border-radius:10px;padding:0 11px;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions button{border:1px solid var(--b);background:#fff;border-radius:10px;padding:10px 13px}.list article{display:grid;grid-template-columns:54px 1fr auto;align-items:center;gap:10px;border-top:1px solid var(--b);padding:10px 0}.thumb{width:54px;height:54px;border-radius:9px;background:#e7ead8;overflow:hidden;display:grid;place-items:center}.thumb img{width:100%;height:100%;object-fit:cover}.list small{display:block;color:var(--m);margin-top:3px}.danger{border:0;background:#f3dfd8;color:#8d2e1e;border-radius:8px;padding:7px}.receiptline{padding:12px 0;border-bottom:1px dashed #bbb}.receiptline div,.total{display:flex;justify-content:space-between}.receiptline small{color:var(--m)}.total{font-size:23px;padding:18px 0}.empty{text-align:center;padding:70px 15px;grid-column:1/-1;color:var(--m)}.hide{display:none!important}.pw{position:relative}.pw input{width:100%;padding-right:45px}.pw button{position:absolute;right:3px;bottom:3px;width:37px;height:37px;border:0;background:transparent;font-size:18px}.note{font-size:12px;color:var(--m);line-height:1.6;background:#f2eee4;border-radius:11px;padding:10px 12px}.progress{font-size:13px;color:var(--m);margin-top:9px}.ok{color:var(--ok)!important}.err{color:var(--r)!important}.cloudlogin{border:1px solid #d8dfbd;background:#f4f7e8;border-radius:14px;padding:14px;margin:14px 0}.cloudlogin b{display:block;margin-bottom:5px}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}.card{display:grid;grid-template-columns:118px 1fr}.pic{height:100%;min-height:172px}.row{grid-template-columns:1fr}.head p{font-size:12px}.panel{padding:20px 16px}}@media print{body>*{display:none!important}#receipt{display:grid!important;position:static;background:#fff;padding:0}#receipt .panel{max-height:none}.x,.receipt-actions{display:none}}
</style>
</head>
<body>
<header class="head"><div><small>三倍笑 · 在线商品目录</small><h1>商品选购清单</h1><p>商品更新后，顾客刷新同一个网址即可看到</p></div><button onclick="openAdmin()">管理</button></header>
<div class="status" id="status">正在连接线上商品…</div>
<section class="tools"><input id="search" class="search" placeholder="搜索商品" oninput="render()"><div id="cats" class="cats"></div></section>
<main id="grid" class="grid"></main>
<div class="cart"><div><span id="count">0 件商品</span><b id="sum">¥0.00</b></div><button onclick="showReceipt()">查看清单</button></div>

<div id="login" class="overlay hide"><section class="panel"><button class="x" onclick="closeAll()">×</button><h2>管理员登录</h2><label class="field pw">管理密码<input id="loginpw" type="password" placeholder="请输入密码"><button type="button" onclick="eye('loginpw',this)">◉</button></label><button class="primary" onclick="localLogin()">登录</button><p id="loginerr" class="err"></p></section></div>

<div id="admin" class="overlay hide"><section class="panel"><button class="x" onclick="closeAll()">×</button><h2>商品管理</h2>
<div class="note">这里不需要 GitHub Token。第一次在这台设备发布商品时，需要登录一次 CloudBase 管理员账号；登录状态通常会保留，之后直接添加并发布即可。</div>
<div id="cloudlogin" class="cloudlogin"><b>云端管理员登录</b><div class="row"><label class="field">管理员账号<input id="clouduser" placeholder="例如：sanbeixiao-admin"></label><label class="field pw">管理员密码<input id="cloudpw" type="password" placeholder="CloudBase 密码"><button type="button" onclick="eye('cloudpw',this)">◉</button></label></div><button class="primary" onclick="cloudAdminLogin()">登录云端后台</button><p id="cloudmsg" class="progress"></p></div>
<h3>添加商品</h3>
<label class="field">商品照片<input id="photo" type="file" accept="image/*"></label>
<div class="row"><label class="field">商品名称<input id="name" placeholder="例如：辣白菜"></label><label class="field">分类<input id="category" value="食品"></label></div>
<div class="row"><label class="field">单价（元）<input id="price" type="number" min="0" step="0.01"></label><label class="field">单位<input id="unit" value="件"></label></div>
<label class="field">规格<input id="spec" placeholder="例如：500克/袋"></label>
<label class="field">商品链接<input id="link" type="url" placeholder="https://…（可不填）"></label>
<button id="savebtn" class="primary" onclick="saveAndPublish()">保存并发布</button><p id="publishmsg" class="progress"></p>
<h3>已发布商品</h3><div id="managed" class="list"></div>
</section></div>

<div id="receipt" class="overlay hide"><section class="panel"><button class="x" onclick="closeAll()">×</button><h2>选购清单</h2><p id="date"></p><div id="receiptlines"></div><div class="total"><span>合计</span><b id="receipttotal"></b></div><div class="actions receipt-actions"><button class="primary" onclick="copyReceipt()">复制清单</button><button onclick="window.print()">打印 / 保存清单</button></div></section></div>
<script>
const ADMIN_PASSWORD_KEY='sanbeixiao-admin-password';
const ADMIN_USER_KEY='sanbeixiao-cloud-user';
const CFG=window.SANBEIXIAO_CLOUDBASE||{};
let app=null,auth=null,db=null,products=[],cart={},cat='全部',cloudReady=false,adminCloudReady=false;
const $=id=>document.getElementById(id),money=n=>'¥'+Number(n||0).toFixed(2);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function safeUrl(u){try{let x=new URL(u,location.href);return /^https?:$/.test(x.protocol)?x.href:''}catch{return''}}
function setStatus(msg,ok=false){$('status').innerHTML=ok?'<b>'+esc(msg)+'</b>':esc(msg)}
function eye(id,b){let i=$(id);i.type=i.type==='password'?'text':'password';b.textContent=i.type==='text'?'◌':'◉'}
function getAuth(a){if(!a)return null;if(typeof a.auth==='function'){try{return a.auth({persistence:'local'})}catch{return a.auth()}}return a.auth}
async function getLoginState(){try{if(auth&&auth.getLoginState)return await auth.getLoginState();if(auth&&auth.currentUser)return auth.currentUser?{user:auth.currentUser}:null}catch{}return null}
async function anonymousSignIn(){if(!auth)throw new Error('身份认证未初始化');let state=await getLoginState();if(state)return state;if(auth.signInAnonymously){let r=await auth.signInAnonymously();if(r&&r.error)throw r.error;return r}if(auth.anonymousAuthProvider)return auth.anonymousAuthProvider().signIn();throw new Error('当前 SDK 不支持匿名登录')}
async function passwordSignIn(username,password){if(!auth)throw new Error('身份认证未初始化');if(auth.signInWithPassword){let r=await auth.signInWithPassword({username,password});if(r&&r.error)throw r.error;return r}if(auth.signInWithUsernameAndPassword)return auth.signInWithUsernameAndPassword(username,password);if(auth.signIn)return auth.signIn({username,password});throw new Error('当前 SDK 不支持账号密码登录')}
async function initCloud(){
 if(!CFG.env){setStatus('CloudBase 尚未连接；当前为第三版测试页面。');$('grid').innerHTML='<div class="empty">后台尚未完成 CloudBase 配置</div>';return}
 try{
  app=cloudbase.init({env:CFG.env,region:CFG.region||'ap-shanghai'});auth=getAuth(app);db=app.database();await anonymousSignIn();cloudReady=true;await loadProducts();setStatus('线上商品已连接',true);
 }catch(e){console.error(e);setStatus('连接 CloudBase 失败：'+(e.message||e));$('grid').innerHTML='<div class="empty">暂时无法读取线上商品</div>'}
}
async function loadProducts(){
 if(!db)return;
 try{let r=await db.collection('catalog').doc('current').get(),doc=(r.data&&r.data[0])||null;products=doc&&Array.isArray(doc.products)?doc.products:[];await resolvePhotos();render();renderManaged()}catch(e){if(/not exist|不存在|NOT_FOUND/i.test(String(e.message||e))){products=[];render();renderManaged()}else throw e}
}
async function resolvePhotos(){let ids=[...new Set(products.map(x=>x.photoFileID).filter(Boolean))];if(!ids.length||!app.getTempFileURL)return;try{let r=await app.getTempFileURL({fileList:ids.map(fileID=>({fileID,maxAge:604800}))}),map={};(r.fileList||[]).forEach(x=>map[x.fileID]=x.tempFileURL||'');products=products.map(x=>({...x,photoURL:x.photoFileID?(map[x.photoFileID]||''):''}))}catch(e){console.warn('照片链接获取失败',e)}}
function render(){let q=$('search').value.trim(),cats=['全部',...new Set(products.map(x=>x.category||'其他'))];$('cats').innerHTML=cats.map(x=>`<button class="${x===cat?'on':''}" onclick="cat=${JSON.stringify(x)};render()">${esc(x)}</button>`).join('');let shown=products.filter(x=>(cat==='全部'||(x.category||'其他')===cat)&&String(x.name||'').includes(q));$('grid').innerHTML=shown.length?shown.map(x=>{let l=safeUrl(x.link);return `<article class="card"><div class="pic">${x.photoURL?`<img src="${esc(x.photoURL)}" alt="${esc(x.name)}">`:'📦'}</div><div class="info"><span class="tag">${esc(x.category||'其他')}</span><h2>${esc(x.name)}</h2><p>${esc(x.spec||'按'+(x.unit||'件')+'出售')}</p>${l?`<a class="productlink" href="${esc(l)}" target="_blank" rel="noopener">查看商品链接 →</a>`:''}<div class="bottom"><span class="price">${money(x.price)}/${esc(x.unit||'件')}</span><div class="step"><button onclick="qty('${esc(x.id)}',-1)">−</button><b>${cart[x.id]||0}</b><button onclick="qty('${esc(x.id)}',1)">＋</button></div></div></div></article>`}).join(''):'<div class="empty">暂无商品</div>';totals()}
function qty(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);render()}
function selected(){return products.filter(x=>cart[x.id]>0).map(x=>({...x,qty:cart[x.id]}))}
function totals(){let a=selected();$('count').textContent=a.reduce((s,x)=>s+x.qty,0)+' 件商品';$('sum').textContent=money(a.reduce((s,x)=>s+Number(x.price)*x.qty,0))}
function openAdmin(){$('loginpw').value='';$('loginerr').textContent='';$('login').classList.remove('hide')}
function closeAll(){document.querySelectorAll('.overlay').forEach(x=>x.classList.add('hide'))}
function localLogin(){if($('loginpw').value===(localStorage.getItem(ADMIN_PASSWORD_KEY)||'19930115')){$('login').classList.add('hide');$('admin').classList.remove('hide');$('clouduser').value=localStorage.getItem(ADMIN_USER_KEY)||'sanbeixiao-admin';checkAdminCloud();renderManaged()}else $('loginerr').textContent='密码不正确'}
async function checkAdminCloud(){let state=await getLoginState();let loginType=state&&state.user&&(state.user.loginType||state.user.login_type);adminCloudReady=!!state&&!/ANONYMOUS/i.test(String(loginType||''));$('cloudlogin').classList.toggle('hide',adminCloudReady);if(adminCloudReady){$('cloudmsg').textContent='云端管理员已登录'}}
async function cloudAdminLogin(){let u=$('clouduser').value.trim(),p=$('cloudpw').value;if(!u||!p){$('cloudmsg').textContent='请输入管理员账号和密码';$('cloudmsg').className='progress err';return}$('cloudmsg').textContent='正在登录…';$('cloudmsg').className='progress';try{let state=await getLoginState();if(state&&auth.signOut)await auth.signOut();else if(state&&auth.signOutAll)await auth.signOutAll();await passwordSignIn(u,p);localStorage.setItem(ADMIN_USER_KEY,u);adminCloudReady=true;$('cloudpw').value='';$('cloudlogin').classList.add('hide');$('cloudmsg').textContent='云端管理员登录成功';$('cloudmsg').className='progress ok';await loadProducts()}catch(e){$('cloudmsg').textContent='登录失败：'+(e.message||e);$('cloudmsg').className='progress err'}}
async function ensureAdmin(){if(adminCloudReady)return true;await checkAdminCloud();if(adminCloudReady)return true;throw new Error('请先登录云端管理员账号')}
async function uploadPhoto(file){if(!file)return '';let ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg',path='products/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.'+ext;if(!app.uploadFile)throw new Error('当前 SDK 不支持上传文件');let r=await app.uploadFile({cloudPath:path,filePath:file});return r.fileID||r.fileId||''}
async function persistProducts(next){await db.collection('catalog').doc('current').set({products:next,updatedAt:new Date()})}
async function saveAndPublish(){let btn=$('savebtn'),msg=$('publishmsg'),name=$('name').value.trim(),price=Number($('price').value);if(!name||!Number.isFinite(price)){alert('请填写商品名称和价格');return}btn.disabled=true;msg.textContent='正在保存并发布…';msg.className='progress';try{await ensureAdmin();let file=$('photo').files[0],photoFileID=await uploadPhoto(file),item={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name,price,category:$('category').value.trim()||'其他',unit:$('unit').value.trim()||'件',spec:$('spec').value.trim(),link:$('link').value.trim(),photoFileID,createdAt:new Date().toISOString()};let next=[...products.map(({photoURL,...x})=>x),item];await persistProducts(next);['name','price','spec','link','photo'].forEach(x=>$(x).value='');msg.textContent='发布成功，顾客刷新网页即可看到';msg.className='progress ok';await loadProducts()}catch(e){msg.textContent='发布失败：'+(e.message||e);msg.className='progress err'}finally{btn.disabled=false}}
function renderManaged(){$('managed').innerHTML=products.map(x=>`<article><div class="thumb">${x.photoURL?`<img src="${esc(x.photoURL)}">`:'📦'}</div><div><b>${esc(x.name)}</b><small>${money(x.price)}/${esc(x.unit||'件')} · ${esc(x.spec||'')}</small></div><button class="danger" onclick="removeProduct('${esc(x.id)}')">下架</button></article>`).join('')||'<p>暂无商品</p>'}
async function removeProduct(id){if(!confirm('确定下架这个商品吗？'))return;try{await ensureAdmin();let next=products.filter(x=>x.id!==id).map(({photoURL,...x})=>x);await persistProducts(next);delete cart[id];await loadProducts();alert('商品已下架')}catch(e){alert('下架失败：'+(e.message||e))}}
function receiptText(){let a=selected(),t=a.reduce((s,x)=>s+Number(x.price)*x.qty,0);return ['三倍笑商品选购清单','日期：'+new Date().toLocaleDateString('zh-CN'),'',...a.flatMap((x,i)=>[`${i+1}. ${x.name} ${x.spec||''}`,`   ${money(x.price)} × ${x.qty}${x.unit||'件'} = ${money(Number(x.price)*x.qty)}`]),'',`总金额：${money(t)}`].join('\n')}
function showReceipt(){let a=selected();if(!a.length){alert('请先选择商品');return}$('date').textContent=new Date().toLocaleDateString('zh-CN');$('receiptlines').innerHTML=a.map(x=>`<div class="receiptline"><div><b>${esc(x.name)}</b><b>${money(Number(x.price)*x.qty)}</b></div><small>${esc(x.spec||'')} · ${money(x.price)} × ${x.qty}${esc(x.unit||'件')}</small></div>`).join('');$('receipttotal').textContent=money(a.reduce((s,x)=>s+Number(x.price)*x.qty,0));$('receipt').classList.remove('hide')}
async function copyReceipt(){try{await navigator.clipboard.writeText(receiptText())}catch{let t=document.createElement('textarea');t.value=receiptText();document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}alert('清单已复制')}
initCloud();
</script>
</body>
</html>
