<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#153f35">
<title>三倍笑商品目录</title>
<style>
:root{--g:#153f35;--g2:#102f28;--l:#c7dc78;--c:#f5f1e8;--p:#fffdf8;--i:#18332d;--m:#6d7772;--b:#ded8cb;--r:#b32929;--ok:#2f6b52}*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer}.head{background:var(--g);color:#fff;padding:24px 20px;display:flex;justify-content:space-between;align-items:center;gap:14px}.head h1{font-size:27px;margin:4px 0}.head p{margin:0;color:#c9d8d3}.head small{color:var(--l);font-weight:800}.head button{background:transparent;color:#fff;border:1px solid #ffffff55;border-radius:999px;padding:9px 14px}.status{max-width:1100px;margin:12px auto 0;padding:0 16px;font-size:12px;color:var(--m)}.status b{color:var(--ok)}.tools{padding:14px 16px 18px;max-width:1100px;margin:auto}.search{width:100%;height:46px;border:1px solid var(--b);background:#fff;border-radius:13px;padding:0 14px}.cats{display:flex;gap:8px;overflow:auto;padding-top:12px}.cats button{white-space:nowrap;border:1px solid var(--b);background:#fff;border-radius:999px;padding:7px 13px;color:var(--i)}.cats button.on{background:var(--g);color:#fff}.grid{max-width:1100px;margin:auto;padding:0 16px 110px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{background:var(--p);border:1px solid var(--b);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 4px 18px rgba(16,47,40,.05)}.pic{width:100%;aspect-ratio:4/3;background:#e7ead8;overflow:hidden;border-bottom:1px solid var(--b)}.pic img{width:100%;height:100%;object-fit:cover;display:block}.info{padding:16px;background:var(--p);display:flex;flex-direction:column;gap:10px}.tag{font-size:11px;background:#e6edcf;padding:4px 9px;border-radius:999px;display:inline-block;align-self:flex-start}.info h2{font-size:22px;line-height:1.2;margin:0;color:var(--g2)}.desc{font-size:14px;color:var(--m);margin:0}.productlink{display:inline-block;color:var(--g);font-size:14px;font-weight:800;text-decoration:none}.price{font-size:22px;font-weight:900;color:var(--g2)}.quantity{margin-top:2px;border-top:1px solid #ece7dc;padding-top:11px;display:flex;justify-content:space-between;align-items:center;gap:10px}.quantity>span{font-size:12px;color:var(--m)}.qtybox{display:flex;align-items:center;gap:7px}.qtybox button{border:0;background:var(--g);color:#fff;width:38px;height:38px;border-radius:50%;font-size:23px;line-height:1}.qtybox input{width:74px;height:38px;border:1px solid var(--b);border-radius:10px;text-align:center;background:#fff;font-weight:800}.cart{position:fixed;z-index:5;bottom:12px;left:50%;transform:translateX(-50%);width:min(700px,calc(100% - 24px));background:var(--g2);color:#fff;border-radius:18px;padding:11px 12px 11px 18px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 10px 30px #102f2866}.cart b{display:block;font-size:21px}.cart span{font-size:12px;color:#bdcdc8}.cart button,.primary{border:0;background:var(--l);font-weight:800;border-radius:11px;padding:13px 18px;color:var(--i)}.overlay{position:fixed;inset:0;background:#102f28aa;z-index:10;display:grid;place-items:center;padding:16px}.panel{background:var(--p);width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:20px;padding:22px;position:relative}.x{position:absolute;right:12px;top:8px;border:0;background:transparent;font-size:28px}.panel h2{margin-top:0}.panel h3{margin:22px 0 8px}.field{display:flex;flex-direction:column;gap:6px;margin:11px 0;font-size:13px;font-weight:700}.field input{height:43px;border:1px solid var(--b);border-radius:10px;padding:0 11px;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions button,.filebtn{border:1px solid var(--b);background:#fff;border-radius:10px;padding:10px 13px}.filebtn input{display:none}.list article{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;border-top:1px solid var(--b);padding:10px 0}.list small{display:block;color:var(--m);margin-top:3px}.danger{border:0;background:#f3dfd8;color:#8d2e1e;border-radius:8px;padding:7px}.receiptline{padding:12px 0;border-bottom:1px dashed #bbb}.receiptline div,.total{display:flex;justify-content:space-between;gap:10px}.receiptline small{color:var(--m)}.total{font-size:23px;padding:18px 0}.empty{text-align:center;padding:70px 15px;grid-column:1/-1;color:var(--m)}.hide{display:none!important}.pw{position:relative}.pw input{width:100%;padding-right:45px}.pw button{position:absolute;right:3px;bottom:3px;width:37px;height:37px;border:0;background:transparent;font-size:18px}.note{font-size:12px;color:var(--m);line-height:1.6;background:#f2eee4;border-radius:11px;padding:10px 12px}.publishbox{border:1px solid #d8dfbd;background:#f4f7e8;border-radius:14px;padding:14px;margin-top:14px}.publishbox b{display:block;margin-bottom:5px}.publishbox a{word-break:break-all;color:var(--g)}.progress{font-size:13px;color:var(--m);margin-top:9px}.ok{color:var(--ok)!important}.err{color:var(--r)!important}.versionitem{border-top:1px solid var(--b);padding:10px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}.versionitem small{color:var(--m);display:block}.versionitem a{color:var(--g);font-weight:700;text-decoration:none}.draftbadge{display:inline-block;background:#fff0c8;color:#795b00;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:800;margin-left:6px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.head p{font-size:12px}.panel{padding:20px 16px}.info{padding:14px}.quantity{align-items:flex-end}.qtybox input{width:82px}}@media print{body>*{display:none!important}#receipt{display:grid!important;position:static;background:#fff;padding:0}#receipt .panel{max-height:none}.x,.receipt-actions{display:none}}
</style>
</head>
<body>
<header class="head"><div><small>三倍笑 · 联网商品目录</small><h1>商品选购清单</h1><p>可直接输入需要的数量</p></div><button onclick="openAdmin()">管理</button></header>
<div class="status" id="status">正在读取线上商品…</div>
<section class="tools"><input id="search" class="search" placeholder="搜索商品" oninput="render()"><div id="cats" class="cats"></div></section>
<main id="grid" class="grid"></main>
<div class="cart"><div><span id="count">已选 0 种商品</span><b id="sum">¥0.00</b></div><button onclick="showReceipt()">查看清单</button></div>
<div id="login" class="overlay hide"><section class="panel"><button class="x" onclick="closeAll()">×</button><h2>管理员登录</h2><label class="field pw">管理密码<input id="loginpw" type="password" placeholder="请输入密码"><button type="button" onclick="eye('loginpw',this)">◉</button></label><button class="primary" onclick="login()">登录</button><p id="loginerr" class="err"></p></section></div>
<div id="admin" class="overlay hide"><section class="panel"><button class="x" onclick="closeAll()">×</button><h2>商品管理 <span id="draftbadge" class="draftbadge hide">有未发布更改</span></h2><div class="note">发布前会读取 GitHub 最新商品并与本机草稿合并，避免不同手机互相覆盖。只有明确点击“下架”的商品才会删除。</div><h3>GitHub 发布设置</h3><label class="field pw">GitHub 发布密钥<input id="ghtoken" type="password" placeholder="fine-grained token"><button type="button" onclick="eye('ghtoken',this)">◉</button></label><div class="actions"><button onclick="saveToken()">保存到本机</button><button onclick="testGitHub()">测试连接</button><button onclick="clearToken()">清除密钥</button></div><p id="ghstatus" class="progress">仓库：ShinNan/EsAT · 目录：sanbeixiao</p><h3>添加商品</h3><label class="field">商品照片（可不上传）<input id="photo" type="file" accept="image/*"></label><div class="row"><label class="field">商品名称<input id="name" placeholder="例如：辣白菜"></label><label class="field">分类<input id="category" value="食品"></label></div><div class="row"><label class="field">单价（元）<input id="price" type="number" min="0" step="0.01"></label><label class="field">单位<input id="unit" value="件"></label></div><label class="field">规格<input id="spec" placeholder="例如：50斤/件"></label><label class="field">商品链接<input id="link" type="url" placeholder="https://…（可不填）"></label><button class="primary" onclick="addProduct()">保存到草稿</button><div class="actions"><button onclick="resetDraft()">重新同步线上商品</button><button onclick="exportData()">导出商品备份</button><label class="filebtn">导入商品备份<input id="importer" type="file" accept="application/json" onchange="importData(this)"></label><button onclick="togglePassword()">修改管理密码</button></div><div id="changepw" class="hide"><label class="field pw">新密码<input id="newpw" type="password" minlength="8"><button type="button" onclick="eye('newpw',this)">◉</button></label><button class="primary" onclick="changePassword()">确认修改</button></div><h3>草稿商品</h3><div id="managed" class="list"></div><div class="publishbox"><b>发布新版本</b><div class="note">可以连续添加多个商品到草稿，全部确认后只发布一次。</div><button id="publishbtn" class="primary" style="margin-top:12px" onclick="publishVersion()">发布新版本</button><p id="publishstatus" class="progress"></p><div id="sharebox" class="hide"><p><b>版本链接</b><a id="sharelink" target="_blank" rel="noopener"></a></p><div class="actions"><button onclick="copyShareLink()">复制链接</button><button onclick="shareVersion()">分享</button></div></div></div><h3>版本历史</h3><div id="history"></div></section></div>
<div id="receipt" class="overlay hide"><section class="panel"><button class="x" onclick="closeAll()">×</button><h2>选购清单</h2><p id="date"></p><div id="receiptlines"></div><div class="total"><span>合计</span><b id="receipttotal"></b></div><div class="actions receipt-actions"><button class="primary" onclick="copyReceipt()">复制清单</button><button onclick="window.print()">打印 / 保存清单</button></div></section></div>
<script>
const ADMIN_PASSWORD_KEY='sanbeixiao-admin-password',TOKEN_KEY='sanbeixiao-github-token',DRAFT_KEY='sanbeixiao-draft-v4';
const GH_OWNER='ShinNan',GH_REPO='EsAT',GH_BRANCH='main',GH_BASE='sanbeixiao';
let publishedProducts=[],draftProducts=[],removedIds=[],cart={},cat='全部',currentVersion='',publishedAt='',historyData=[],draftDirty=false;
const $=id=>document.getElementById(id),money=n=>'¥'+Number(n).toFixed(2),clone=v=>JSON.parse(JSON.stringify(v));
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function safeUrl(u){try{const x=new URL(u,location.href);return /^https?:$/.test(x.protocol)?x.href:''}catch{return''}}function setStatus(msg,ok=false){$('status').innerHTML=ok?'<b>'+esc(msg)+'</b>':esc(msg)}
function mergeProducts(server,local,removed=[]){const map=new Map();for(const p of server||[])if(p&&p.id)map.set(p.id,clone(p));for(const p of local||[])if(p&&p.id)map.set(p.id,clone(p));for(const id of removed||[])map.delete(id);return [...map.values()]}
async function loadPublished(){try{let params=new URLSearchParams(location.search),v=params.get('v'),target='./data/latest.json';if(v&&/^[0-9A-Za-z_-]{1,80}$/.test(v))target='./data/versions/'+encodeURIComponent(v)+'.json';let r=await fetch(target+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;let d=await r.json();publishedProducts=Array.isArray(d.products)?d.products:[];currentVersion=d.version||'';publishedAt=d.publishedAt||'';setStatus((v?'正在查看固定版本：':'当前版本：')+(currentVersion||'未命名'),true)}catch{publishedProducts=[];setStatus('线上目录尚未发布商品')}render();try{let h=await fetch('./data/history.json?t='+Date.now(),{cache:'no-store'});if(h.ok){historyData=await h.json();renderHistory()}}catch{}}
function render(){const q=$('search').value.trim(),cats=['全部',...new Set(publishedProducts.map(x=>x.category||'其他'))];$('cats').innerHTML=cats.map(x=>`<button class="${x===cat?'on':''}" onclick="cat=${JSON.stringify(x)};render()">${esc(x)}</button>`).join('');const shown=publishedProducts.filter(x=>(cat==='全部'||(x.category||'其他')===cat)&&String(x.name||'').includes(q));$('grid').innerHTML=shown.length?shown.map(x=>{const l=safeUrl(x.link),u=x.unit||'件';return `<article class="card">${x.photo?`<div class="pic"><img src="${esc(x.photo)}" alt="${esc(x.name)}"></div>`:''}<div class="info"><span class="tag">${esc(x.category||'其他')}</span><h2>${esc(x.name)}</h2>${x.spec?`<p class="desc">${esc(x.spec)}</p>`:''}${l?`<a class="productlink" href="${esc(l)}" target="_blank" rel="noopener">查看商品链接 →</a>`:''}<div class="price">${money(x.price)}/${esc(u)}</div><div class="quantity"><span>订购数量（${esc(u)}）</span><div class="qtybox"><button onclick="qty('${esc(x.id)}',-1)">−</button><input id="q-${esc(x.id)}" type="number" min="0" step="any" inputmode="decimal" value="${cart[x.id]||0}" oninput="setQty('${esc(x.id)}',this.value)"><button onclick="qty('${esc(x.id)}',1)">＋</button></div></div></div></article>`}).join(''):'<div class="empty">暂无商品</div>';totals()}
function setQty(id,v){let n=Number(v);if(!Number.isFinite(n)||n<0)n=0;n=Math.round(n*100)/100;cart[id]=n;const el=$('q-'+id);if(el&&Number(el.value)!==n)el.value=n;totals()}function qty(id,d){setQty(id,(Number(cart[id])||0)+d)}function selected(){return publishedProducts.filter(x=>Number(cart[x.id])>0).map(x=>({...x,qty:Number(cart[x.id])}))}function totals(){const a=selected();$('count').textContent='已选 '+a.length+' 种商品';$('sum').textContent=money(a.reduce((s,x)=>s+Number(x.price)*x.qty,0))}
function openAdmin(){$('loginpw').value='';$('loginerr').textContent='';$('login').classList.remove('hide')}function closeAll(){document.querySelectorAll('.overlay').forEach(x=>x.classList.add('hide'))}function login(){if($('loginpw').value===(localStorage.getItem(ADMIN_PASSWORD_KEY)||'19930115')){$('login').classList.add('hide');$('admin').classList.remove('hide');loadDraft();$('ghtoken').value=localStorage.getItem(TOKEN_KEY)||'';renderManaged();renderHistory()}else $('loginerr').textContent='密码不正确'}function eye(id,b){const i=$(id);i.type=i.type==='password'?'text':'password';b.textContent=i.type==='text'?'◌':'◉'}
function loadDraft(){try{const d=JSON.parse(localStorage.getItem(DRAFT_KEY)||'null');if(d&&Array.isArray(d.products)){removedIds=Array.isArray(d.removedIds)?d.removedIds:[];draftProducts=mergeProducts(publishedProducts,d.products,removedIds);draftDirty=!!d.dirty}else{draftProducts=clone(publishedProducts);removedIds=[];draftDirty=false}}catch{draftProducts=clone(publishedProducts);removedIds=[];draftDirty=false}saveDraft();showDirty()}
function saveDraft(){try{localStorage.setItem(DRAFT_KEY,JSON.stringify({products:draftProducts,removedIds,dirty:draftDirty,baseVersion:currentVersion}))}catch{alert('本机草稿空间不足')}showDirty()}function showDirty(){$('draftbadge').classList.toggle('hide',!draftDirty)}
function imageToData(file){return new Promise((resolve,reject)=>{if(!file)return resolve('');const url=URL.createObjectURL(file),img=new Image;img.onload=()=>{try{const max=1400,scale=Math.min(1,max/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale)),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);const data=c.toDataURL('image/jpeg',0.82);URL.revokeObjectURL(url);resolve(data)}catch(e){reject(e)}};img.onerror=()=>reject(new Error('照片读取失败'));img.src=url})}
async function addProduct(){const name=$('name').value.trim(),price=Number($('price').value);if(!name||!Number.isFinite(price)){alert('请填写商品名称和价格');return}let photo='';try{photo=await imageToData($('photo').files[0])}catch(e){alert(e.message);return}draftProducts.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name,price,category:$('category').value.trim()||'其他',unit:$('unit').value.trim()||'件',spec:$('spec').value.trim(),link:$('link').value.trim(),photo});draftDirty=true;saveDraft();['name','price','spec','link','photo'].forEach(x=>$(x).value='');renderManaged();alert('已加入草稿，可以继续添加下一个商品')}
function renderManaged(){$('managed').innerHTML=draftProducts.map(x=>`<article><div><b>${esc(x.name)}</b><small>${money(x.price)}/${esc(x.unit||'件')}${x.spec?' · '+esc(x.spec):''}</small></div><button class="danger" onclick="removeProduct('${esc(x.id)}')">下架</button></article>`).join('')||'<p>暂无商品</p>'}function removeProduct(id){if(confirm('确定下架这个商品吗？')){draftProducts=draftProducts.filter(x=>x.id!==id);if(publishedProducts.some(x=>x.id===id)&&!removedIds.includes(id))removedIds.push(id);draftDirty=true;saveDraft();renderManaged()}}function resetDraft(){if(!confirm('确定放弃本机未发布更改，并重新同步线上商品吗？'))return;draftProducts=clone(publishedProducts);removedIds=[];draftDirty=false;saveDraft();renderManaged()}
function togglePassword(){$('changepw').classList.toggle('hide')}function changePassword(){const p=$('newpw').value;if(p.length<8){alert('密码至少8位');return}localStorage.setItem(ADMIN_PASSWORD_KEY,p);$('newpw').value='';$('changepw').classList.add('hide');alert('管理密码已修改，仅保存在当前浏览器')}function exportData(){const b=new Blob([JSON.stringify({products:draftProducts,removedIds},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='三倍笑商品资料备份.json';a.click();URL.revokeObjectURL(a.href)}function importData(i){const r=new FileReader;r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.products))throw 0;draftProducts=mergeProducts(publishedProducts,d.products,Array.isArray(d.removedIds)?d.removedIds:[]);removedIds=Array.isArray(d.removedIds)?d.removedIds:[];draftDirty=true;saveDraft();renderManaged();alert('已导入并与线上商品合并')}catch{alert('备份文件无效')}};if(i.files[0])r.readAsText(i.files[0])}
function saveToken(){const t=$('ghtoken').value.trim();if(!t){alert('请先输入 GitHub 发布密钥');return}localStorage.setItem(TOKEN_KEY,t);$('ghstatus').textContent='发布密钥已保存在当前浏览器';$('ghstatus').className='progress ok'}function clearToken(){localStorage.removeItem(TOKEN_KEY);$('ghtoken').value='';$('ghstatus').textContent='发布密钥已清除';$('ghstatus').className='progress'}function token(){return $('ghtoken').value.trim()||localStorage.getItem(TOKEN_KEY)||''}
async function gh(path,options={}){const t=token();if(!t)throw new Error('请先填写并保存 GitHub 发布密钥');const r=await fetch('https://api.github.com/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/'+path+(options.method?'':'?ref='+encodeURIComponent(GH_BRANCH)),{method:options.method||'GET',headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+t,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},body:options.body?JSON.stringify(options.body):undefined});if(!r.ok){let d={};try{d=await r.json()}catch{}throw new Error('GitHub：'+(d.message||r.status))}return r.json()}async function testGitHub(){const el=$('ghstatus');el.textContent='正在测试连接…';try{await gh(GH_BASE+'/data/latest.json');el.textContent='连接成功，可以发布';el.className='progress ok';saveToken()}catch(e){el.textContent=e.message;el.className='progress err'}}
function utf8b64(s){const bytes=new TextEncoder().encode(s);let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(bin)}function b64utf8(s){const bin=atob((s||'').replace(/\n/g,'')),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}async function getSha(path){try{return (await gh(path)).sha||null}catch(e){if(/404|Not Found/i.test(e.message))return null;throw e}}async function putText(path,text,message){const sha=await getSha(path),body={message,content:utf8b64(text),branch:GH_BRANCH};if(sha)body.sha=sha;return gh(path,{method:'PUT',body})}async function putBase64(path,b64,message){const sha=await getSha(path),body={message,content:b64,branch:GH_BRANCH};if(sha)body.sha=sha;return gh(path,{method:'PUT',body})}
function versionId(){let d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds())+'-'+Math.random().toString(36).slice(2,6)}async function uploadDraftPhotos(products,version){const out=clone(products);for(let i=0;i<out.length;i++){const p=out[i];if(p.photo&&p.photo.startsWith('data:image/')){setPublish('正在上传照片 '+(i+1)+' / '+out.length+'：'+p.name);const comma=p.photo.indexOf(','),meta=p.photo.slice(0,comma),b64=p.photo.slice(comma+1),ext=meta.includes('png')?'png':'jpg',name=version+'-'+p.id+'.'+ext,path=GH_BASE+'/uploads/'+name;await putBase64(path,b64,'Upload catalogue image '+name);p.photo='uploads/'+name}}return out}function setPublish(msg,type=''){$('publishstatus').textContent=msg;$('publishstatus').className='progress '+type}async function getOnlineLatest(){const d=await gh(GH_BASE+'/data/latest.json');const json=JSON.parse(b64utf8(d.content));return Array.isArray(json.products)?json.products:[]}
async function publishVersion(){const btn=$('publishbtn');if(!token()){alert('请先填写 GitHub 发布密钥');return}btn.disabled=true;$('sharebox').classList.add('hide');try{setPublish('正在读取 GitHub 最新商品，防止覆盖…');const online=await getOnlineLatest(),merged=mergeProducts(online,draftProducts,removedIds);if(!merged.length&&!confirm('合并后没有商品，仍然发布空目录吗？'))return;const v=versionId(),published=new Date().toISOString(),clean=await uploadDraftPhotos(merged,v),payload={version:v,publishedAt:published,products:clean};await putText(GH_BASE+'/data/versions/'+v+'.json',JSON.stringify(payload,null,2),'Publish catalogue version '+v);await putText(GH_BASE+'/data/latest.json',JSON.stringify(payload,null,2),'Update latest catalogue to '+v);let hist=Array.isArray(historyData)?historyData:[];hist=[{version:v,publishedAt:published},...hist.filter(x=>x.version!==v)].slice(0,50);await putText(GH_BASE+'/data/history.json',JSON.stringify(hist,null,2),'Update catalogue history');historyData=hist;publishedProducts=clean;draftProducts=clone(clean);removedIds=[];draftDirty=false;currentVersion=v;publishedAt=published;saveDraft();render();renderManaged();renderHistory();let u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('v',v);$('sharelink').href=u.href;$('sharelink').textContent=u.href;$('sharebox').classList.remove('hide');setPublish('发布成功：已与线上最新商品合并。','ok');setStatus('当前版本：'+v,true)}catch(e){setPublish(e.message,'err')}finally{btn.disabled=false}}
function copyShareLink(){let u=$('sharelink').href;if(!u)return;navigator.clipboard?.writeText(u).then(()=>alert('链接已复制')).catch(()=>prompt('复制这个链接：',u))}async function shareVersion(){let u=$('sharelink').href;if(!u)return;if(navigator.share){try{await navigator.share({title:'三倍笑商品目录',url:u})}catch{}}else copyShareLink()}function renderHistory(){let root=$('history');if(!root)return;let base=new URL(location.href);base.search='';base.hash='';root.innerHTML=(Array.isArray(historyData)&&historyData.length)?historyData.map(x=>{let u=new URL(base);u.searchParams.set('v',x.version);return `<div class="versionitem"><div><b>${esc(x.version)}</b><small>${x.publishedAt?new Date(x.publishedAt).toLocaleString('zh-CN'):''}</small></div><a href="${esc(u.href)}" target="_blank" rel="noopener">打开版本</a></div>`}).join(''):'<p class="note">还没有版本历史</p>'}
function unitLabel(x){const u=String(x.unit||'件').trim();return u==='斤'?'1斤':u}function receiptTitle(x){const parts=[unitLabel(x)];if(x.spec)parts.push(x.spec);return `${x.name}（${parts.join(' · ')}）`}function receiptText(){const a=selected(),t=a.reduce((s,x)=>s+Number(x.price)*x.qty,0);return ['三倍笑商品选购清单','日期：'+new Date().toLocaleDateString('zh-CN'),'',...a.flatMap((x,i)=>[`${i+1}. ${receiptTitle(x)}`,`   ${money(x.price)} × ${x.qty} = ${money(Number(x.price)*x.qty)}`]),'',`总金额：${money(t)}`].join('\n')}function showReceipt(){const a=selected();if(!a.length){alert('请先选择商品');return}$('date').textContent=new Date().toLocaleDateString('zh-CN');$('receiptlines').innerHTML=a.map(x=>`<div class="receiptline"><div><b>${esc(receiptTitle(x))}</b><b>${money(Number(x.price)*x.qty)}</b></div><small>${money(x.price)} × ${esc(x.qty)} = ${money(Number(x.price)*x.qty)}</small></div>`).join('');$('receipttotal').textContent=money(a.reduce((s,x)=>s+Number(x.price)*x.qty,0));$('receipt').classList.remove('hide')}async function copyReceipt(){try{await navigator.clipboard.writeText(receiptText())}catch{const t=document.createElement('textarea');t.value=receiptText();document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}alert('清单已复制')}loadPublished();
</script>
